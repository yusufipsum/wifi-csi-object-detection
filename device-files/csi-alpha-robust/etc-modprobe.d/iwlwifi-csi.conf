# ISTEGE BAGLI. Yalnizca panelde "AX210 uplink 802.11ax (HE)" uyarisi gorunuyorsa kurun.
# bcm43455c0 (802.11ac) HE PPDU'larindan CSI cikaramaz; AX210'u 802.11ac (VHT) ile
# iletisime zorlar. Kurulum:
#   sudo cp iwlwifi-csi.conf /etc/modprobe.d/ && sudo reboot
# Geri almak icin dosyayi silip yeniden baslatin.
options iwlwifi disable_11ax=1
